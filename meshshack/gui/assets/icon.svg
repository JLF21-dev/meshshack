<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- MeshShack: three mesh nodes linked around a station, on a rounded tile. -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="#17415f"/>
  <g stroke="#9fd3ff" stroke-width="3.2" stroke-linecap="round">
    <line x1="32" y1="34" x2="14" y2="18"/>
    <line x1="32" y1="34" x2="50" y2="18"/>
    <line x1="32" y1="34" x2="32" y2="54"/>
    <line x1="14" y1="18" x2="50" y2="18" stroke-opacity="0.45"/>
  </g>
  <circle cx="14" cy="18" r="6" fill="#ffffff"/>
  <circle cx="50" cy="18" r="6" fill="#ffffff"/>
  <circle cx="32" cy="54" r="5" fill="#ffffff"/>
  <circle cx="32" cy="34" r="8.5" fill="#ffb300" stroke="#17415f" stroke-width="2.5"/>
</svg>
